name: CI

# Project verification: unit tests + JS/Python syntax on every push to main and
# every pull request. (The separate "Claudinite checks" workflow handles the
# working-guidelines conformance sweep — this one is the code's own gate.)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify (tests + syntax)
        run: bash scripts/verify.sh
