name: Inspect edfringe page

# Diagnostic: the listing is a Next.js app that loads shows client-side via an
# API (RTK Query). This run renders the page with a headless browser and
# captures the network requests so we can find the show-data API endpoint and
# its response shape.

on:
  workflow_dispatch:
    inputs:
      page:
        description: Page number to load
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture network with Playwright
        env:
          PAGE: ${{ inputs.page }}
        run: |
          set -euo pipefail
          npm i -g playwright >/dev/null 2>&1 || npm i playwright
          npx playwright install chromium >/dev/null 2>&1 || true
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const page_n = process.env.PAGE || '2';
          const url = `https://www.edfringe.com/tickets/whats-on?page=${page_n}`;
          const browser = await chromium.launch();
          const ctx = await browser.newContext({ userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' });
          const pg = await ctx.newPage();
          const calls = [];
          pg.on('response', async (resp) => {
            const u = resp.url();
            const ct = (resp.headers()['content-type'] || '');
            if (ct.includes('json') || /api|graphql|search|event/i.test(u)) {
              let bodyLen = 0, sample = '';
              try { const b = await resp.body(); bodyLen = b.length; sample = b.toString('utf8').slice(0, 600); } catch {}
              calls.push({ status: resp.status(), ct, u, bodyLen, sample });
            }
          });
          await pg.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto:', e.message));
          await pg.waitForTimeout(4000);
          console.log('=== JSON / api-ish responses ===');
          for (const c of calls) {
            console.log('\n----');
            console.log(c.status, c.ct, c.bodyLen, 'bytes');
            console.log(c.u);
            console.log('SAMPLE:', c.sample.replace(/\n/g, ' '));
          }
          // How many show-card-ish nodes ended up in the DOM?
          const counts = await pg.evaluate(() => ({
            links: document.querySelectorAll('a[href*="/tickets/whats-on/"]').length,
            articles: document.querySelectorAll('article').length,
            h3: document.querySelectorAll('h3').length,
          }));
          console.log('\n=== DOM counts after render ===', JSON.stringify(counts));
          await browser.close();
          JS
          node probe.mjs
