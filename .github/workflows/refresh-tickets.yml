name: Refresh today's ticket status (hourly)

# In-festival, live-ish availability: hourly during 8AM–11PM Edinburgh time in
# August, re-fetch the listing and update only *today's* per-performance ticket
# status in its day file (drives the SOLD OUT stamp). Light — one paged pass, no
# per-show queries. A no-op on any date with no day file, so early-August /
# off-window firings cost nothing.

on:
  # Hourly during August, but only 8AM–11PM Edinburgh time (BST = UTC+1), and
  # never on the round hour: each hour is pinned to a different, irregular minute
  # in the 7–12 range. GitHub cron can't randomise a time and the job mustn't
  # sleep, so we spell out one line per hour — one firing each, jittered minute,
  # robust to GitHub's own scheduling delay. (Fixed per hour, i.e. the same each
  # day; cron can't re-randomise per firing.) Times in comments are BST.
  schedule:
    - cron: "9 7 * 8 *"    # 08:09
    - cron: "12 8 * 8 *"   # 09:12
    - cron: "7 9 * 8 *"    # 10:07
    - cron: "11 10 * 8 *"  # 11:11
    - cron: "8 11 * 8 *"   # 12:08
    - cron: "10 12 * 8 *"  # 13:10
    - cron: "12 13 * 8 *"  # 14:12
    - cron: "7 14 * 8 *"   # 15:07
    - cron: "11 15 * 8 *"  # 16:11
    - cron: "8 16 * 8 *"   # 17:08
    - cron: "10 17 * 8 *"  # 18:10
    - cron: "12 18 * 8 *"  # 19:12
    - cron: "7 19 * 8 *"   # 20:07
    - cron: "11 20 * 8 *"  # 21:11
    - cron: "9 21 * 8 *"   # 22:09
    - cron: "8 22 * 8 *"   # 23:08
  workflow_dispatch:
    inputs:
      date:
        description: Override date (YYYY-MM-DD), for testing
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: refresh-tickets
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh today's ticket status
        run: |
          python3 scraper/refresh_ticket_status.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/days data/venues.json
          if git diff --staged --quiet; then
            echo "No ticket-status changes this hour."
          else
            git commit -m "Refresh today's ticket status"
            git push
          fi

  # A scheduled run is watched by no one, so surface a failure to a human by
  # opening (or updating) a standing tracking issue found by title. (Mirrors
  # the daily refresh.yml job; a cancelled run from the concurrency group's
  # cancel-in-progress doesn't count as failure() so a superseded hourly
  # firing never falsely triggers this.)
  report-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure-tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Hourly ticket-status refresh is failing"
          body="The scheduled \`Refresh today's ticket status (hourly)\` workflow failed. Latest run: $RUN_URL"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
