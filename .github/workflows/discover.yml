name: Discover subgenre source (throwaway)

# TEMPORARY probe: runs scraper/discover_schema.py on an open-network runner to
# find where a show's subgenre lives in the edfringe GraphQL API. Triggered on
# push to the feature branch; both this workflow and discover_schema.py are
# removed once the source is known.

on:
  push:
    branches: [claude/show-subgenre-display-sea5y6]
    paths:
      - scraper/discover_schema.py
      - .github/workflows/discover.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe the API schema
        working-directory: scraper
        run: python3 discover_schema.py
