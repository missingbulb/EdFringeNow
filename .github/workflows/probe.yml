name: Probe one show (throwaway)

# TEMPORARY: dump a single show with every GraphQL field + its pricing, on an
# open-network runner. Triggered on push to the feature branch; both this
# workflow and probe_show.py are removed once reviewed.

on:
  push:
    branches: [claude/show-subgenre-display-sea5y6]
    paths:
      - scraper/probe_show.py
      - .github/workflows/probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dump the show
        working-directory: scraper
        run: python3 probe_show.py daniel-sloss-bitter
