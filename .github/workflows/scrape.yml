name: Scrape edfringe shows

# Download all Edinburgh Fringe shows from the edfringe.com GraphQL data API and
# upload the structured JSON as a build artifact for later use.
#
# Run it manually from the Actions tab (workflow_dispatch). GitHub-hosted
# runners can reach the API directly.

on:
  workflow_dispatch:
    inputs:
      per:
        description: Shows per page
        required: false
        default: "50"
      min_delay:
        description: Minimum delay between requests (seconds)
        required: false
        default: "4"
      max_delay:
        description: Maximum delay between requests (seconds)
        required: false
        default: "9"
      max_pages:
        description: Optional cap on number of pages (blank = all)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch shows from the API
        run: |
          python3 scraper/fetch_shows.py \
            --per "${{ inputs.per }}" \
            --min-delay "${{ inputs.min_delay }}" \
            --max-delay "${{ inputs.max_delay }}" \
            ${{ inputs.max_pages && format('--max-pages {0}', inputs.max_pages) || '' }}

      - name: Summarise
        if: always()
        run: |
          echo "Page files:"
          ls -1 data/raw_pages/page_*.json 2>/dev/null | wc -l
          echo "Shows in shows.json:"
          python3 -c "import json,sys; print(len(json.load(open('data/raw_pages/shows.json'))))" 2>/dev/null || echo "n/a"
          du -sh data/raw_pages 2>/dev/null || true

      - name: Upload shows artifact
        uses: actions/upload-artifact@v4
        with:
          name: edfringe-shows
          path: data/raw_pages/
          retention-days: 90
          if-no-files-found: error
