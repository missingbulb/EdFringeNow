name: Scrape edfringe shows (full)

# Full rebuild: download every show from the edfringe.com GraphQL API, normalize
# into the website-ready data files, and commit them. Currently INERT — see the
# `inert` job below; a dispatch reports the switch and fetches nothing. For the lightweight daily top-up see the `refresh-shows` scheduled
# task, which the Claudinite scheduler runs (scraper/README.md).

on:
  workflow_dispatch:
    inputs:
      per:
        description: Shows per page
        required: false
        default: "50"
      min_delay:
        description: Minimum delay between requests (seconds)
        required: false
        default: "4"
      max_delay:
        description: Maximum delay between requests (seconds)
        required: false
        default: "9"
      commit:
        description: Commit the normalized data back to the repo
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  # The kill switch. Scraping is off — the owner's call — and a dispatchable
  # workflow is a live route to the API, so the real job below is gated off and
  # this reports why instead of a silently skipped run. Turning scraping back on
  # is deleting this job and the `if: false` under it.
  inert:
    runs-on: ubuntu-latest
    steps:
      - name: Update scraping is switched off
        run: |
          echo "This workflow is inert: update scraping is switched off."
          echo "Nothing was fetched and no data file was touched."

  scrape:
    if: false   # the kill switch above
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch all shows from the API
        run: |
          python3 scraper/fetch_shows.py \
            --recently-added ANY \
            --per "${{ inputs.per }}" \
            --min-delay "${{ inputs.min_delay }}" \
            --max-delay "${{ inputs.max_delay }}"

      - name: Normalize into website data
        run: python3 scraper/normalize.py

      - name: Summarise
        if: always()
        run: |
          python3 -c "import json; d=json.load(open('site/data/days/index.json')); print('shows:',d['shows'],'venues:',d['venues'],'days:',len(d['dates']))" 2>/dev/null || echo "n/a"

      - name: Upload raw scrape artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edfringe-raw
          path: data/raw_pages/
          retention-days: 90
          if-no-files-found: error

      - name: Commit normalized data
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # This step retries, because a plain push here is guaranteed to lose
          # the run (#292, and the same shape again as #695): this job's
          # 60-minute timeout puts a full scrape squarely in range of
          # refresh-tickets's hourly push to main, and the commit exists only
          # on the runner, which is then reclaimed with the data on it.
          #
          # Recovery RE-DERIVES rather than merges. Every path staged here is
          # generator output, and refresh-tickets rewrites exactly the day
          # files and availability sidecar this run also produces — a rebase
          # would conflict on generated bytes whose only correct value is
          # whatever the generator says now, not either side's stored
          # version. Instead: take their generated data (which also carries
          # the append-only lookup lists and geocode cache normalize.py
          # extends rather than replaces), regenerate from that plus our own
          # already-fetched raw pages, and retry.
          for attempt in 1 2 3 4 5; do
            git add data/normalized site/data
            if git diff --staged --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -q -m "Update Fringe data (full scrape)"
            if git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected on attempt ${attempt}; re-deriving onto latest main"
            git fetch -q origin main
            git reset -q --soft origin/main
            git checkout -q origin/main -- data/normalized site/data
            python3 scraper/normalize.py
          done
          echo "::error::could not push the scraped data after 5 attempts"
          exit 1
