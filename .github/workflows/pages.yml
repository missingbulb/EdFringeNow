name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # the deploy bumps the version and commits it back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bump version
        # Every production deploy advances the version. Scheme: 1.<mmdd>.<prev+1>
        # (see scripts/bump-version.mjs). package.json stays the single source of
        # truth, so the bumped file both ships in this deploy's artifact (the perf
        # pill reads it) and is committed back to main below for the next deploy.
        id: bump
        run: |
          NEW_VERSION=$(node scripts/bump-version.mjs)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped app version to $NEW_VERSION"
      - name: Commit version bump
        # Persist the bump to main. [skip ci] keeps this commit from re-triggering
        # this (or any) workflow, so there's no deploy loop. Rebase-retry in case a
        # data-refresh workflow pushed to main between checkout and now.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed version bump on attempt $attempt."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Failed to push version bump after $attempt attempts." >&2
              exit 1
            fi
            echo "Push rejected — rebasing on latest main and retrying (attempt $attempt)."
            git pull --rebase origin main
          done
      - name: Stamp build info
        run: |
          TIME=$(TZ='Asia/Jerusalem' git log -1 --date=format-local:'%Y-%m-%d %H:%M' --format=%cd)
          printf 'window.__BUILD__ = { time: "%s" };\n' "$TIME" > js/build-info.js
          echo "Stamped build time $TIME (Israel) into js/build-info.js"
      - name: Inject Cloudflare Web Analytics token
        # The beacon token is public (it ships in the client), so it lives in a
        # repo *variable*, not a secret. When set, substitute it into the served
        # analytics.js; when unset, the placeholder stays and analytics no-ops.
        # sed uses '#' as its delimiter so the line contains no shell pipe.
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ANALYTICS_TOKEN" ]; then
            sed -i "s#REPLACE_WITH_CLOUDFLARE_WEB_ANALYTICS_TOKEN#${CLOUDFLARE_ANALYTICS_TOKEN}#" js/analytics.js
            echo "Injected Cloudflare Web Analytics token from the CLOUDFLARE_ANALYTICS_TOKEN variable."
          else
            echo "CLOUDFLARE_ANALYTICS_TOKEN variable not set — analytics stays off (placeholder retained)."
          fi
      - name: Prune non-site files from the Pages artifact
        # .claude/skills/* are symlinks into the gitignored .claudinite/ corpus,
        # which is empty on the runner (the corpus is synced by a SessionStart
        # hook that never runs in CI). upload-pages-artifact tars with
        # --dereference, which follows those dangling links and fails. These are
        # agent-tooling dirs, not part of the published site, so drop them.
        run: rm -rf .claude .claudinite
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
