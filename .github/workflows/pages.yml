name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp build info
        run: |
          HASH=$(git rev-parse --short=4 HEAD)
          TIME=$(TZ='Europe/London' git log -1 --date=format-local:'%Y-%m-%d %H:%M' --format=%cd)
          printf 'window.__BUILD__ = { hash: "%s", time: "%s" };\n' "$HASH" "$TIME" > js/build-info.js
          echo "Stamped build $HASH ($TIME) into js/build-info.js"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
