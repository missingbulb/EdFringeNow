name: Refresh edfringe shows (daily)

# Lightweight daily top-up: fetch only shows added/updated in the last seven days
# (recentlyAdded=LAST_SEVEN_DAYS), merge them into the existing normalized
# master, regenerate the venue + per-day files, and commit any changes.

on:
  schedule:
    - cron: "20 5 * * *"   # 05:20 UTC daily
  workflow_dispatch:
    inputs:
      window:
        description: Recently-added window
        type: choice
        options: [LAST_SEVEN_DAYS, LAST_TWENTY_FOUR_HOURS, ANY]
        required: false
        default: LAST_SEVEN_DAYS

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch recently added shows
        run: |
          python3 scraper/fetch_shows.py \
            --recently-added "${{ inputs.window || 'LAST_SEVEN_DAYS' }}" \
            --min-delay 4 --max-delay 9

      - name: Merge into normalized data
        run: python3 scraper/normalize.py --merge

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/normalized data/venues.json data/days
          if git diff --staged --quiet; then
            echo "No data changes today."
          else
            git commit -m "Refresh Fringe data (daily top-up)"
            git push
          fi

  # A scheduled run is watched by no one, so surface a failure to a human by
  # opening (or updating) a standing tracking issue found by title.
  report-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure-tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily Fringe data refresh is failing"
          body="The scheduled \`Refresh edfringe shows (daily)\` workflow failed. Latest run: $RUN_URL"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
