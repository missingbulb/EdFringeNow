<!doctype html>
<html lang="en-GB">
<head>

<title>Who's coming? · EdFringeNow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2B1D4F; --cream: #FFF8EC; --paper: #FFFDF7; --white: #fff;
  --marigold: #FFC63D; --coral: #FF6F59; --teal: #1DB9A6; --sky: #58C7F3; --violet: #6c4cf1;
  --indigo: #2E2270; --pink: #FF8DB3; --lime: #A8E05F; --peach: #FFB088; --lavender: #E6DEFF;
  --display: 'Baloo 2', 'Verdana', 'DejaVu Sans', sans-serif;
  --body: 'Nunito', 'Trebuchet MS', 'DejaVu Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1440px; background: var(--bg, #FFC63D); }
body { font-family: var(--body); font-weight: 700; color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.2; }
svg.pic { display: block; overflow: visible; }
.screen { width: 1440px; min-height: 960px; background: var(--bg); padding: 26px 56px 60px; display: flex; flex-direction: column; align-items: center; gap: 30px; position: relative; overflow: hidden; }
.screen.dark { color: var(--cream); }

/* ---------- top: brand + token row ---------- */
.top { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .01em; padding-top: 12px; }
.brand span { color: var(--violet); }
.dark .brand span { color: var(--marigold); }
.tokens { display: flex; gap: 12px; align-items: flex-start; }
.token { width: 88px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.token .disc { width: 64px; height: 64px; border-radius: 50%; background: var(--cream); border: 3px solid var(--ink); display: grid; place-items: center; box-shadow: 0 4px 0 var(--ink); }
.token .disc .pic { width: 44px; height: 44px; }
.token small { font-size: 13px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
.token.empty .disc { background: rgba(255,255,255,.18); border: 3px dashed rgba(43,29,79,.45); box-shadow: none; }
.token.empty .disc .pic { opacity: .38; filter: grayscale(.6); }
.token.current .disc .pic { opacity: .55; }
.dark .token.empty .disc { border-color: rgba(255,248,236,.4); }
.token.current .disc { background: rgba(255,255,255,.55); border: 3px dashed var(--ink); box-shadow: 0 0 0 6px rgba(255,255,255,.35); }
.token.landed .disc { box-shadow: 0 4px 0 var(--ink), 0 0 0 5px var(--marigold); }
.top .right { justify-self: end; padding-top: 6px; }

/* ---------- the question ---------- */
.q { font-family: var(--display); font-weight: 800; font-size: 72px; line-height: 1; text-align: center; letter-spacing: -.01em; }
.q.small { font-size: 44px; }
.cards { display: flex; gap: 28px; justify-content: center; }
.card { width: 300px; height: 356px; background: var(--cream); border: 3px solid var(--ink); border-radius: 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 22px 20px 24px; gap: 12px; position: relative; box-shadow: 0 8px 0 var(--ink); }
.card > .pic { width: 224px; height: 224px; }
.card b { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; }
.card.is-on { background: var(--white); transform: translateY(-8px); box-shadow: 0 16px 0 var(--ink); }
.card.is-added { background: var(--white); }
.badge { position: absolute; top: -20px; right: -16px; width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; box-shadow: 0 4px 0 var(--ink); }
.badge .pic { width: 34px; height: 34px; }
.badge.yes { background: var(--coral); }
.badge.plus { background: var(--teal); }
.badge.add { background: var(--marigold); width: 48px; height: 48px; top: -14px; right: -12px; box-shadow: none; opacity: .9; }
.badge.add .pic { width: 24px; height: 24px; }
.badge { color: var(--ink); }
.badge.yes { color: #fff; }

/* find-by chips */
.chips { display: flex; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px 0 12px; border-radius: 999px; border: 3px solid var(--ink); background: rgba(255,255,255,.35); font-family: var(--display); font-weight: 800; font-size: 19px; }
.chip .pic { width: 30px; height: 30px; }
.chip.is-on { background: var(--ink); color: var(--cream); }

/* ---------- calendar strip ---------- */
.when { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.strip { position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 26px; padding: 14px 16px 12px; box-shadow: 0 8px 0 var(--ink); display: grid; grid-template-columns: repeat(25, 44px); column-gap: 6px; row-gap: 6px; }
.strip .ribbon { height: 18px; border-radius: 999px; grid-row: 1; align-self: center; position: relative; }
.strip .ribbon.two { grid-row: 2; }
.strip .ribbon i { position: absolute; left: 12px; top: 0; font-style: normal; font-size: 13px; font-weight: 800; line-height: 18px; color: var(--cream); }
.strip .ribbon.faint { opacity: .28; }
.strip .marks { grid-row: 3; grid-column: 7 / span 5; display: grid; grid-template-columns: repeat(5, 44px); column-gap: 6px; height: 66px; align-items: end; position: relative; }
.strip .marks .pic { width: 40px; height: 40px; justify-self: center; }
.strip .marks .moons { position: absolute; left: 22px; right: 22px; top: 0; display: flex; justify-content: space-around; }
.strip .marks .moons .pic { width: 22px; height: 22px; }
.strip .range { grid-row: 4; grid-column: 7 / span 5; background: var(--marigold); border-radius: 18px; margin: -4px -6px; }
.strip .d { grid-row: 4; width: 44px; height: 66px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; z-index: 1; }
.strip .d small { font-size: 13px; font-weight: 800; opacity: .55; }
.strip .d b { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1; }
.strip .d.we { background: rgba(43,29,79,.06); }
.strip .d.edge { background: var(--ink); color: var(--cream); }
.strip .d.edge small { opacity: .8; }
.strip .d.in small { opacity: .75; }

/* ---------- buttons ---------- */
.actions { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
.btn { display: inline-flex; align-items: center; gap: 14px; height: 68px; padding: 0 30px 0 34px; border-radius: 999px; background: var(--ink); color: var(--cream); font-family: var(--display); font-weight: 800; font-size: 27px; border: 3px solid var(--ink); box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.btn .pic { width: 34px; height: 34px; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: none; padding: 0 30px 0 22px; }
.dark .btn.ghost { color: var(--cream); border-color: var(--cream); }
.btn.hot { background: var(--coral); color: var(--ink); }
.btn.sun { background: var(--marigold); color: var(--ink); }

/* sticker buttons: picture + a word */
.stickers { display: flex; gap: 16px; }
.sticker { display: flex; align-items: center; gap: 12px; height: 68px; padding: 0 22px 0 10px; border-radius: 999px; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 22px; }
.sticker .pic { width: 48px; height: 48px; }

/* ---------- day cards ---------- */
.board { display: flex; gap: 14px; align-items: flex-start; position: relative; width: 1366px; margin: 0 -19px; }
.day { color: var(--ink); width: 262px; background: var(--cream); border: 3px solid var(--ink); border-radius: 26px; padding: 0 12px 14px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 0 var(--ink); position: relative; }
.day .band { height: 72px; margin: 0 -12px 0; position: relative; border-bottom: 3px solid var(--ink); }
.day .band .pic { position: absolute; left: 50%; bottom: -3px; width: 240px; height: 80px; transform: translateX(-50%); }
.day .head { display: flex; align-items: baseline; gap: 8px; padding: 8px 6px 6px; }
.day .head b { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; }
.day .head span { font-family: var(--display); font-weight: 800; font-size: 20px; }
.day .head em { font-style: normal; font-size: 13px; opacity: .6; margin-left: auto; }
.tile { position: relative; display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 8px; padding: 9px 8px 9px 8px; background: var(--white); border: 2.5px solid var(--ink); border-radius: 16px 16px 10px 16px; min-height: 58px; }
.tile .gl { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--lavender); }
.tile .gl .pic { width: 22px; height: 22px; }
.tile .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .t b { font-size: 15px; font-weight: 800; line-height: 1.15; }
.tile .t span { font-size: 13px; font-weight: 700; opacity: .62; }
.tile .t .row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tile .t .row em { font-style: normal; font-size: 13px; font-weight: 800; opacity: 1; flex: none; }
.tile .t i { font-style: normal; font-size: 13px; font-weight: 800; }
.tile.show { border-left-width: 8px; }
.tile.fringe { border-left-color: var(--violet); } .tile.fringe .gl { background: #E6DEFF; }
.tile.eif { border-left-color: var(--teal); } .tile.eif .gl { background: #CFF3EC; }
.tile.book { border-left-color: #E38B1F; } .tile.book .gl { background: #FFE3B8; }
.tile.tattoo { border-left-color: #2F6FE4; } .tile.tattoo .gl { background: #D2E3FF; }
.tile.meal { border-radius: 999px; background: var(--peach); min-height: 52px; padding: 6px 12px 6px 8px; }
.tile.meal .gl { background: var(--white); }
.tile.meal .gl .pic { width: 30px; height: 30px; }
.tile.meal.unbooked { background: #FFE9DA; }
.tile .book { position: absolute; right: -6px; top: -12px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--marigold); border: 2.5px solid var(--ink); font-size: 13px; font-weight: 800; display: flex; align-items: center; }
.tile.stay { background: var(--lavender); min-height: 48px; padding: 5px 12px 5px 8px; }
.tile.stay .gl { background: var(--white); } .tile.stay .gl .pic { width: 30px; height: 30px; }
.tile.trip { background: var(--sky); }
.tile.trip .gl { background: var(--white); } .tile.trip .gl .pic { width: 30px; height: 30px; }
.tile.trip::before, .tile.trip::after { content: ''; position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--cream); border: 2.5px solid var(--ink); transform: translateY(-50%); }
.tile.trip::before { left: -10px; } .tile.trip::after { right: -10px; }
.tile.out { display: flex; flex-direction: column; align-items: stretch; gap: 0; padding: 0; background: var(--white); overflow: hidden; }
.tile.out .art { height: 112px; position: relative; overflow: hidden; border-bottom: 2.5px solid var(--ink); background: #E3F6FF; }
.tile.out .art .pic { width: 176px; height: 176px; position: absolute; left: 50%; top: -22px; transform: translateX(-50%); }
.tile.out .t { padding: 9px 12px 10px; }
.tile.free { background: transparent; border-style: dashed; min-height: 48px; }
.tile.free .gl { background: rgba(255,255,255,.6); } .tile.free .gl .pic { width: 30px; height: 30px; }
.tile .star { position: absolute; top: -12px; right: -10px; width: 30px; height: 30px; }
.tile .ok { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.tile .ok { color: var(--cream); } .tile .ok .pic { width: 14px; height: 14px; }
.tile .kids { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 800; background: var(--marigold); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 7px; }
.tile.ghost { border: 2.5px dashed rgba(43,29,79,.5); background: transparent; }
.tile.ghost > * { visibility: hidden; }

/* ---------- celebration ---------- */
.confetti { position: absolute; inset: 0; pointer-events: none; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.hero .q { color: var(--cream); }
.hero .q em { font-style: normal; color: var(--marigold); }

/* ---------- flipped tile ---------- */
.flip { position: absolute; width: 396px; background: var(--white); border: 4px solid var(--ink); border-radius: 30px; padding: 16px 16px 16px; box-shadow: 0 22px 0 var(--ink), 0 42px 70px rgba(0,0,0,.5); z-index: 6; color: var(--ink); }
.flip .front { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 800; }
.flip .front .gl { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--lavender); }
.flip .front .gl .pic { width: 22px; height: 22px; }
.flip .front span { opacity: .6; margin-left: auto; white-space: nowrap; }
.flip h3 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; margin: 10px 0 12px; }
.flip .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { position: relative; height: 146px; border: 3px solid var(--ink); border-radius: 24px; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.opt .pic { width: 86px; height: 86px; }
.opt b { font-family: var(--display); font-weight: 800; font-size: 20px; }
.opt .no { position: absolute; top: -12px; right: -12px; width: 52px; height: 52px; filter: drop-shadow(0 3px 0 rgba(43,29,79,.6)); }
.opt.wide { grid-column: 1 / -1; height: 150px; }
.keep { margin-top: 12px; height: 58px; border-radius: 999px; background: var(--marigold); border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--display); font-weight: 800; font-size: 24px; box-shadow: 0 5px 0 var(--ink); }
.keep .pic { width: 36px; height: 36px; }
.press { position: absolute; width: 60px; height: 60px; z-index: 5; }
.press .ring { position: absolute; left: 0; top: 0; width: 60px; height: 60px; }
.press .cur { position: absolute; left: 26px; top: 22px; width: 34px; height: 34px; }
.dim { opacity: .5; }

/* ---------- kids' ages strip (under the chosen party card) ---------- */
.ages { display: flex; align-items: center; gap: 14px; height: 72px; padding: 0 12px 0 22px; border-radius: 999px; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); margin-left: 172px; margin-top: -6px; }
.ages .lbl { font-family: var(--display); font-weight: 800; font-size: 22px; margin-right: 4px; }
.ages .kid { display: flex; align-items: center; gap: 4px; }
.ages .kid .pic { width: 52px; height: 52px; }
.ages .kid b { width: 36px; height: 36px; border-radius: 50%; background: var(--marigold); border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; }
.ages .add { width: 48px; height: 48px; border-radius: 50%; border: 3px dashed var(--ink); display: grid; place-items: center; }
.ages .add .pic { width: 22px; height: 22px; }
.flip.one { width: 320px; }
.flip.one h3 { font-size: 28px; }
.flip.one .opt.wide { height: 132px; flex-direction: row; gap: 14px; }
.flip.one .opt.wide .pic { width: 76px; height: 76px; }
.flip.one .keep { height: 56px; font-size: 21px; }

/* ---------- revisions ---------- */
.tile .curl { position: absolute; right: -2.5px; bottom: -2.5px; width: 22px; height: 22px; }
.tile.trip .curl, .tile.out .curl { right: -2.5px; bottom: -2.5px; }
.tile.out { border-radius: 16px 16px 10px 16px; }
.token.hover .disc { transform: translateY(-5px); box-shadow: 0 9px 0 var(--ink); position: relative; }
.token.hover .edit { position: absolute; right: -10px; top: -8px; width: 28px; height: 28px; border-radius: 50%; background: var(--marigold); border: 2.5px solid var(--ink); display: grid; place-items: center; }
.token.hover .edit .pic { width: 17px; height: 17px; }
.token .disc { position: relative; }
.hero3 { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
.hero3 .q { color: var(--cream); }
.hero3 .q em { font-style: normal; color: var(--marigold); }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px 0 12px; border-radius: 999px; border: 2.5px solid rgba(255,248,236,.55); color: var(--cream); font-size: 15px; font-weight: 800; }
.pill .pic { width: 24px; height: 24px; }
.totals { justify-self: end; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px; padding: 10px 14px; display: grid; grid-template-columns: 26px auto auto; column-gap: 10px; row-gap: 4px; align-items: center; box-shadow: 0 5px 0 var(--ink); min-width: 210px; }
.totals .pic { width: 26px; height: 26px; }
.totals span { font-size: 14px; font-weight: 800; }
.totals b { font-family: var(--display); font-weight: 800; font-size: 18px; text-align: right; }
.moonlabel { font-size: 13px; font-weight: 800; opacity: .8; }
.strip .marks .moons { top: 2px; }
.strip .marks .moons { align-items: center; }
.strip .marks .cap { position: absolute; left: 0; right: 0; top: 26px; text-align: center; font-size: 13px; font-weight: 800; }
.card.wide b { font-size: 26px; }
.cards.three .card { width: 340px; height: 380px; }
.cards.three .card > .pic { width: 240px; height: 240px; }
.cards.pick .card { width: 300px; height: 300px; }
.cards.pick .card > .pic { width: 170px; height: 170px; }
.stay { display: flex; align-items: center; gap: 22px; background: var(--white); border: 3px solid var(--ink); border-radius: 30px; padding: 16px 28px 16px 18px; box-shadow: 0 8px 0 var(--ink); }
.stay .pic.big { width: 150px; height: 150px; }
.stay .txt { display: flex; flex-direction: column; gap: 6px; }
.stay .txt b { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; }
.stay .txt .line { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
.stay .txt .line .pic { width: 26px; height: 26px; }
.stay .price { margin-left: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 150px; height: 110px; border-radius: 24px; background: var(--marigold); border: 3px solid var(--ink); }
.stay .price b { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; }
.stay .price small { font-size: 14px; font-weight: 800; }
.stay .more { margin-left: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 92px; height: 110px; border-radius: 24px; border: 3px dashed var(--ink); justify-content: center; font-family: var(--display); font-weight: 800; font-size: 18px; }
.stay .more .pic { width: 34px; height: 34px; }
.sleepwrap { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.flip .opts .opt b { font-size: 21px; }
.flip.one { width: 300px; }
.flip.one .opt.wide { height: 118px; }
.flip.one .opt.wide .pic { width: 66px; height: 66px; }
.dim { opacity: .45; }

</style>
</head>
