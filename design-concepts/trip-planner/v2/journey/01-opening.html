<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><title>Where to? — EdFringeNow trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--slate:#2e3745;--slate2:#5b6780;--slate3:#98a2b5;--ink:#1f2633;--heather:#8c6fc0;--heather2:#c9b8e6;--heather3:#ece5f5;
--gold:#e5b544;--gold2:#f7e6b8;--cream:#f4ecdc;--paper:#fffaf0;--accent:#ff5a3c;--accent2:#ffe3dc;--sky:#dde6ee;--sky2:#eef2f6;--night:#3a4457}
*{box-sizing:border-box}
body{margin:0;background:#e6ddcb}
.page{width:1440px;background:var(--cream);color:var(--slate);position:relative;overflow:hidden;
  font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.3}
.serif{font-family:'DM Serif Display','Iowan Old Style','Palatino Linotype',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.brand{position:absolute;top:22px;left:56px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--slate2);display:flex;align-items:center;gap:10px;z-index:3}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
svg{display:block}

/* ---- the route map ---- */
.map{position:relative;height:360px}
.map>svg{position:absolute;inset:0}
.pin{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translate(-50%,-26px);z-index:2}
.pin .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2.5px solid var(--slate);position:relative;box-shadow:0 6px 14px -8px rgba(46,55,69,.5)}
.pin .dot svg{width:34px;height:34px}
.pin .lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--slate2);white-space:nowrap;background:var(--cream);padding:0 4px;border-radius:4px}
.pin.todo .dot{border:2.5px dashed var(--slate3);background:transparent;box-shadow:none}
.pin.todo .dot svg{opacity:.32;filter:grayscale(1)}
.pin.todo .lbl{color:var(--slate3)}
.pin.done .dot .ok{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--slate);display:grid;place-items:center;border:2px solid var(--paper)}
.pin.done .dot .ok svg{width:12px;height:12px;opacity:1}
.pin.done .three{display:flex;gap:1px}.pin.done .three svg{width:15px;height:15px}
.pin.now{transform:translate(-50%,-48px);z-index:3}
.pin.now .dot{width:96px;height:96px;border:4px solid var(--accent);box-shadow:0 0 0 10px rgba(255,90,60,.16),0 14px 30px -14px rgba(255,90,60,.7)}
.pin.now .dot svg{width:62px;height:62px}
.pin.now .lbl{color:var(--accent);font-size:12.5px}
.lead{position:absolute;border-left:3px dotted var(--accent);z-index:1}

/* ---- the current stop's card ---- */
.card{position:relative;margin:26px auto 0;width:1120px;background:var(--paper);border-radius:30px;padding:40px 48px 40px;
  box-shadow:0 30px 60px -40px rgba(46,55,69,.45),0 0 0 1px rgba(46,55,69,.08)}
.card .notch{position:absolute;top:-13px;left:var(--nx);width:26px;height:26px;background:var(--paper);transform:rotate(45deg);border-radius:4px 0 0 0;box-shadow:-1px -1px 0 rgba(46,55,69,.08)}
.q{font-size:46px;line-height:1;margin:0 0 30px}
.btn{display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 28px 0 32px;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-size:18px;font-weight:700;border:0;cursor:pointer;box-shadow:0 12px 24px -12px rgba(255,90,60,.8);white-space:nowrap}
.btn svg{width:22px;height:22px}
.btn.quiet{background:transparent;color:var(--slate);box-shadow:none;border:2px solid rgba(46,55,69,.18)}
.foot{display:flex;justify-content:flex-end;margin-top:34px}

/* illustrated radio options */
.opts{display:flex;gap:22px}
.opt{flex:1;min-height:270px;border-radius:24px;background:var(--cream);border:2.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 18px 26px;position:relative;cursor:pointer}
.opt svg.ico{width:180px;height:150px}
.opt .lbl{font-size:19px;font-weight:700;letter-spacing:-.01em}
.opt.on{background:#fff;border-color:var(--accent);box-shadow:0 22px 40px -28px rgba(255,90,60,.7)}
.opt .ok{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center}
.opt .ok svg{width:16px;height:16px}
.opt.on .ok{display:grid}
.ages{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:-4px}
.age{width:44px;height:44px;border-radius:50%;background:var(--gold2);border:2px solid var(--gold);display:grid;place-items:center;font-weight:700;font-size:17px;font-family:inherit}
.age.plus{background:transparent;border:2px dashed var(--slate3);color:var(--slate2)}
.age.plus svg{width:16px;height:16px}

/* screen 1 pieces */
.ways{display:flex;gap:14px;margin-bottom:28px}
.way{display:flex;align-items:center;gap:12px;height:58px;padding:0 22px 0 14px;border-radius:999px;background:var(--cream);border:2.5px solid transparent;font-weight:700;font-size:16px;cursor:pointer}
.way svg{width:36px;height:36px}
.way.on{background:#fff;border-color:var(--accent)}
.found{display:flex;align-items:center;gap:36px;padding:26px 28px;border-radius:22px;background:var(--heather3);margin-bottom:22px}
.city{display:flex;align-items:center;gap:16px;min-width:300px}
.city svg{width:96px;height:80px}
.city b{display:block;font-size:44px;line-height:1}
.city small{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--heather);background:#fff;padding:5px 12px;border-radius:999px}
.fests{display:flex;gap:14px;flex:1}
.fest{flex:1;min-height:132px;border-radius:18px;background:#fff;border:2.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 10px;position:relative;text-align:center;font-weight:700;font-size:14.5px;line-height:1.15;cursor:pointer}
.fest svg.ico{width:64px;height:56px}
.fest .ok,.fest .pl{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.fest .ok{background:var(--accent);color:#fff}.fest .pl{border:2px dashed var(--slate3);color:var(--slate2)}
.fest .ok svg,.fest .pl svg{width:14px;height:14px}
.fest.on{border-color:var(--accent)}
.fest.also{border-color:var(--heather)}.fest.also .ok{background:var(--heather)}
.when{display:flex;align-items:center;gap:22px}
.date{display:flex;flex-direction:column;gap:2px;padding:14px 22px;border-radius:16px;background:#fff;border:2px solid rgba(46,55,69,.12);min-width:190px}
.date small{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--slate2)}
.date b{font-size:26px;line-height:1.05}
.when>svg{width:26px;height:26px;color:var(--slate3);flex:none}
.month{display:flex;align-items:center;gap:16px;margin-top:18px}
.month .cells{display:flex;gap:3px;flex:1}
.month i{flex:1;height:24px;border-radius:5px;background:#fff;border:1px solid rgba(46,55,69,.14)}
.month i.on{background:var(--accent);border-color:var(--accent)}
.month i.off{opacity:.35}
.month small{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--slate2)}
.when .btn{margin-left:auto}

/* ---- the travel-guide schedule ---- */
.guide{padding:30px 56px 56px}
.guide-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.guide-head h1{margin:0;font-size:52px;line-height:1}
.guide-head .note svg{width:24px;height:24px}
.guide-head .note{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--slate2);background:var(--paper);padding:8px 14px;border-radius:999px;border:1px solid rgba(46,55,69,.12)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;align-items:start}
.day{position:relative;background:var(--paper);border-radius:6px;padding:20px 16px 22px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 0 rgba(46,55,69,.12),0 18px 30px -26px rgba(46,55,69,.6),4px 4px 0 -1px #efe5d2,4px 4px 0 0 rgba(46,55,69,.14)}
.day header{display:flex;align-items:baseline;gap:10px;justify-content:space-between;border-bottom:2px solid var(--slate);padding-bottom:8px}
.day .num{font-size:74px;line-height:.82;color:var(--ink)}
.day .dow{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--slate2)}
.day .art{height:120px;border-radius:6px;overflow:hidden}
.day .art svg{width:100%;height:100%}
.stubs{display:flex;flex-direction:column;gap:9px}
.stub{position:relative;display:grid;grid-template-columns:60px 1fr;min-height:58px;border-radius:9px;background:#fff;border:1.5px solid rgba(46,55,69,.16);overflow:visible}
.stub .t{font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-right:1.5px dashed var(--slate3);background:var(--heather3);border-radius:8px 0 0 8px;padding:0 2px}
.stub .b{padding:8px 34px 8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.stub .ttl{font-size:14px;font-weight:700;line-height:1.15;color:var(--ink)}
.stub .ven{font-size:11.5px;color:var(--slate2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stub .k{position:absolute;right:8px;top:50%;width:26px;height:26px;transform:translateY(-50%)}
.stub .k.big{width:34px;height:34px}
.stub::before,.stub::after{content:'';position:absolute;left:53px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:1.5px solid rgba(46,55,69,.16)}
.stub::before{top:-8px;border-top-color:transparent;border-left-color:transparent;border-right-color:transparent}
.stub::after{bottom:-8px;border-bottom-color:transparent;border-left-color:transparent;border-right-color:transparent}
.stub.eif .t{background:var(--sky)}
.stub.book .t{background:var(--gold2)}
.stub.tattoo .t{background:var(--accent2)}
.stub.food .t{background:var(--cream)}
.stub.travel .t,.stub.stay .t{background:var(--sky2)}
.stub.out{min-height:118px}.stub.out .t{background:var(--gold2)}
.stub.free{border-style:dashed;background:transparent}.stub.free .t{background:transparent}
.stub .price{font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;color:var(--slate2);letter-spacing:0}
.stub .star{position:absolute;right:-9px;top:-11px;width:30px;height:30px}
.stub .once{position:absolute;right:-7px;top:-9px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;font-style:normal}
.stub .once svg{width:14px;height:14px}
.more{display:flex;align-items:center;gap:18px;margin-top:30px;padding-top:26px;border-top:1.5px dashed rgba(46,55,69,.22)}
.add{display:flex;align-items:center;gap:14px;height:72px;padding:0 26px 0 12px;border-radius:999px;background:var(--paper);border:2px solid rgba(46,55,69,.12);font-weight:700;font-size:17px;cursor:pointer}
.add svg{width:50px;height:50px}
.more .btn{margin-left:auto}

/* ---- the correction fold ---- */
.day.lift{z-index:6}
.wrap{position:relative}
.stub.open{border-color:var(--accent);border-width:2.5px;box-shadow:0 0 0 6px rgba(255,90,60,.14)}
.flap{position:absolute;left:100%;top:-2px;margin-left:10px;display:flex;gap:12px;padding:14px 14px;background:var(--paper);border-radius:18px;
  box-shadow:0 30px 60px -30px rgba(46,55,69,.6),0 0 0 1.5px rgba(46,55,69,.14);z-index:7;white-space:nowrap}
.flap::before{content:'';position:absolute;left:-10px;top:26px;width:18px;height:18px;background:var(--paper);transform:rotate(45deg);box-shadow:-1.5px 1.5px 0 rgba(46,55,69,.14)}
.flap .fold{position:absolute;left:0;top:0;bottom:0;width:26px;border-radius:18px 0 0 18px;background:linear-gradient(90deg,rgba(46,55,69,.16),rgba(46,55,69,0))}
.flap .fold::after{content:'';position:absolute;left:6px;top:10px;bottom:10px;border-left:1.5px dashed var(--slate3)}
.choice{width:112px;height:118px;border-radius:16px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:700;text-align:center;line-height:1.15;cursor:pointer;position:relative;white-space:normal;padding:0 6px}
.choice svg{width:60px;height:60px}
.choice .over{position:absolute;top:0;left:0}
.choice.keep{background:var(--gold2)}
.choice.hot{outline:2.5px solid var(--accent);background:#fff}
.flap.small{padding:12px}
.flap.small .choice{width:100px;height:118px}
.flap.left{left:auto;right:100%;margin-left:0;margin-right:10px}
.flap.left::before{left:auto;right:-10px;box-shadow:1.5px -1.5px 0 rgba(46,55,69,.14)}
.flap.left .fold{left:auto;right:0;border-radius:0 18px 18px 0;background:linear-gradient(270deg,rgba(46,55,69,.16),rgba(46,55,69,0))}
</style></head>
