# The Singapore International Film Festival: who it is, its editions, and the
# sources an edition's information block is assembled from. The contract every
# key follows is scraper/festivals/README.md. Asia's longest-running film
# festival, with its award-winners' screenings a week after the main run.

id = "singapore-international-film-festival"
name = "Singapore International Film Festival"
city = "Singapore"
country = "SG"
# The city's centre, for the festival timeline and travel maths between
# cities; venues carry their own coordinates.
lat = 1.2903
lng = 103.852
timezone = "Asia/Singapore"
lang = "en"
dir = "ltr"
kind = "film"
subtypes = ["film-international"]
default_genre = "film"
site = "https://sgiff.com"

[ticketing]
model = "central-box-office"
url = "https://sgiff.eventive.org"
notes = "Sold on sgiff.eventive.org, one ticket page per screening; the box office marks screenings SOLD OUT or NOT AVAILABLE FOR SALE YET with tags, which are read as availability."
currency = "SGD"

[[edition]]
id = "2026"
# The box office names it the 37th Singapore International Film Festival.
ordinal = 37
format = "block"
first = "2026-10-21"
last = "2026-11-07"
sources = ["eventive", "nominatim", "venues-research"]

[[source]]
id = "eventive"
kind = "fetched"
roles = ["events", "performances", "venues", "availability", "prices"]
required = true
fetcher = "sources/eventive/fetch.py"
adapter = "singapore_international_film_festival/eventive.py"

# The box office prints street addresses but no coordinates.
[[source]]
id = "nominatim"
kind = "fetched"
roles = ["venues"]
required = true
fetcher = "sources/nominatim/fetch.py"
adapter = "singapore_international_film_festival/nominatim.py"

# Hand research for the venues the programme source leaves without an
# address or a pin, each figure cited.
[[source]]
id = "venues-research"
kind = "curated"
roles = ["venues"]
required = true
path = "curated/venues.json"
adapter = "singapore_international_film_festival/venues_research.py"

[merge]
venues = ["venues-research", "eventive", "nominatim"]
events = ["eventive"]
performances = ["eventive"]
