# The Silicon Valley Jewish Film Festival: who it is, its editions, and the
# sources an edition's information block is assembled from. The contract every
# key follows is scraper/festivals/README.md. Jewish-themed film at AMC Saratoga
# in San Jose and the Palo Alto JCC.

id = "silicon-valley-jewish-film-festival"
name = "Silicon Valley Jewish Film Festival"
city = "San Jose"
country = "US"
region = "California"
# The city's centre, for the festival timeline and travel maths between
# cities; venues carry their own coordinates.
lat = 37.3382
lng = -121.8863
timezone = "America/Los_Angeles"
lang = "en"
dir = "ltr"
kind = "film"
subtypes = ["film-jewish"]
default_genre = "film"
site = "https://www.svjff.org"

[ticketing]
model = "central-box-office"
url = "https://svjff.eventive.org"
notes = "Sold on svjff.eventive.org, one ticket page per screening."
currency = "USD"

[[edition]]
id = "2026"
format = "block"
first = "2026-10-10"
last = "2026-10-25"

[[source]]
id = "eventive"
kind = "fetched"
roles = ["events", "performances", "venues", "availability", "prices"]
required = true
fetcher = "sources/eventive/fetch.py"
adapter = "silicon_valley_jewish_film_festival/eventive.py"

# The box office prints street addresses but no coordinates.
[[source]]
id = "nominatim"
kind = "fetched"
roles = ["venues"]
required = true
fetcher = "sources/nominatim/fetch.py"
adapter = "silicon_valley_jewish_film_festival/nominatim.py"

[merge]
venues = ["eventive", "nominatim"]
events = ["eventive"]
performances = ["eventive"]
