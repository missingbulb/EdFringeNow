# The cities around our festivals, for the "time off" half of a plan: where to
# stay and eat, what is open to see between shows, and where to go for a day.
# One [[city]] per festival city, its `name` exactly the registry's `city` for
# the festivals it hosts; the contract is scraper/cities/README.md.
#
# `radius_m` bounds what counts as "in town" around the centre: wide enough for
# a day's sightseeing, narrow enough that a planner's walk/transit maths holds.
# `near_m` is how far from a festival venue a hotel or restaurant may be and
# still be offered: a walk in a city, a short drive where the venue stands
# alone in the countryside.
# `wikivoyage` is the English Wikivoyage guide whose "Go next" section names the
# day trips: the city's own, or the nearest town's where the place has none.

