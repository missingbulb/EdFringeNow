machine_readable = "GET https://pretalx.com/api/events/ lists every hosted event (no key); https://pretalx.com/<slug>/schedule/export/schedule.json is one event's schedule (days, rooms, talks)"
how = """One call lists all 700+ hosted events; filter date_from inside the window, then fetch each schedule.json. A 404 on schedule.json means the schedule is not published yet: watch it. \
Mostly tech and security conferences, with some academic societies (history, religion, bioethics, criminology) among them."""
